name: Release (signed APK + AAB)

# يتشغّل تلقائيًا عند دفع وسم مثل v1.2.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # مطلوب لإنشاء Release ورفع الأصول

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build-signed-release:
    name: Build signed release & publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KS:-}" ]; then
            echo "::error::السر ANDROID_KEYSTORE_BASE64 غير موجود — أضف keystore (base64) في Settings > Secrets > Actions."
            exit 1
          fi
          printf '%s' "$KS" | base64 -d > /tmp/cove.keystore
          test -s /tmp/cove.keystore

      - name: Build signed release (APK + AAB)
        env:
          ANDROID_KEYSTORE_PATH: /tmp/cove.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # versionName من الوسم، وversionCode تلقائي ومتصاعد من رقم تشغيل الـ workflow
          ./gradlew --no-daemon \
            -PversionName="$VERSION" \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            assembleRelease bundleRelease

      - name: Verify signing & package artifacts
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK" && test -s "$AAB"
          cp "$APK" Cove.apk
          cp "$AAB" Cove.aab
          # تأكيد أن الـ APK موقّع
          ( "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner verify --print-certs Cove.apk || true ) | head -5 || true
          sha256sum Cove.apk Cove.aab > "${GITHUB_REF_NAME}.sha256"
          ls -la Cove.apk Cove.aab "${GITHUB_REF_NAME}.sha256"

      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            Cove.apk Cove.aab "${GITHUB_REF_NAME}.sha256" \
            --title "Cove ${VERSION}" \
            --generate-notes
